[project]
name = "neuron-communities"
version = "0.1.0"
description = "Neuron communities in Llama-3.1-8B: attribution harvest, co-occurrence graph partitioning, necessity and sufficiency evaluation"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "safetensors>=0.4",
    "datasets>=2.20",
    "numpy>=1.26",
    "scipy>=1.13",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuron_communities*"]
